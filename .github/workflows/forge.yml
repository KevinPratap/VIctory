name: Forge

# Rebuilds forge/main and STATUS.md by the rules in RULES.md: every 12 hours,
# or by hand from the Actions tab. Reads upstream only; writes only to this
# repository's forge/main, forge/tested and forge-status branches.
on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions: {}

# One run at a time; a scheduled run waits for a manual one instead of racing it.
concurrency:
  group: forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 345
    outputs:
      promoted: ${{ steps.forge.outputs.promoted }}
      previous_tested: ${{ steps.tested.outputs.previous }}
    env:
      CARGO_TERM_COLOR: never
      GH_TOKEN: ${{ github.token }}
      # Merge commits made by the bot carry no co-author line.
      FORGE_TRAILER: ""
    defaults:
      run:
        shell: bash
    steps:
      # Pinned to full commit SHAs, as upstream's CI does.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: forge-status
          path: forge-status
          persist-credentials: false
      - name: Test the promotion gate
        run: python -I forge-status/test_promotion.py -v
      - name: Remember the previous tested branch
        id: tested
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          previous="$(git ls-remote "$url" refs/heads/forge/tested)"
          echo "previous=${previous%%$'\t'*}" >> "$GITHUB_OUTPUT"
      - name: Clone upstream
        run: git clone --no-tags https://github.com/Marvisak/VIctory.git victory
      - name: Toolchain (rust-toolchain.toml)
        working-directory: victory
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: victory
          shared-key: forge
      - name: Git identity for the merge commits
        run: |
          git config --global user.name "VIctory Forge"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Forge
        id: forge
        run: |
          python -I forge-status/forge.py --repo victory --out out \
            --held forge-status/held.json --previous forge-status/status.json --tests \
            --tested-branch forge/tested --diagnostic-runs 6 --diagnostic-seconds 900
          python -I -c "import json,os; d=json.load(open('out/promotion.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('promoted='+str(d['promoted']).lower()+'\n')"
      - name: Package candidate refs for the separate publisher
        working-directory: victory
        env:
          PROMOTED: ${{ steps.forge.outputs.promoted }}
        run: |
          refs=(refs/heads/forge/main)
          if [[ "$PROMOTED" == true ]]; then refs+=(refs/heads/forge/tested); fi
          git bundle create ../out/forge.bundle "${refs[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: forge-result
          path: |
            out/*.log
            out/forge.bundle
            out/promotion.json
            out/status.json
            out/STATUS.md

  # Candidate build scripts and tests run only in the read-only job above.
  # This worker imports Git objects and reports; it never checks out or runs
  # candidate code with the publishing credential.
  publish:
    needs: forge
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTED: ${{ needs.forge.outputs.promoted }}
      PREVIOUS_TESTED: ${{ needs.forge.outputs.previous_tested }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: forge-status
          path: forge-status
          persist-credentials: false
      - name: Download the completed candidate
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name forge-result --dir out
      - name: Import candidate refs without executing their code
        run: |
          git init -q victory
          git -C victory bundle verify ../out/forge.bundle
          git -C victory fetch -q ../out/forge.bundle refs/heads/forge/main:refs/heads/forge/main
          if [[ "$PROMOTED" == true ]]; then
            git -C victory fetch -q ../out/forge.bundle refs/heads/forge/tested:refs/heads/forge/tested
          fi
          python -I - <<'PY'
          import json, os, re, subprocess
          with open('out/promotion.json', encoding='utf-8') as stream:
              promotion = json.load(stream)
          with open('out/status.json', encoding='utf-8') as stream:
              status = json.load(stream)
          if type(promotion['promoted']) is not bool:
              raise SystemExit('invalid promotion verdict')
          if str(promotion['promoted']).lower() != os.environ['PROMOTED']:
              raise SystemExit('promotion output does not match the report')
          head = promotion['head']
          if not re.fullmatch(r'[0-9a-f]{40}|[0-9a-f]{64}', head) or status['head'] != head:
              raise SystemExit('candidate reports do not name the same commit')
          refs = ['refs/heads/forge/main']
          if promotion['promoted']:
              refs.append('refs/heads/forge/tested')
          for ref in refs:
              actual = subprocess.check_output(['git', '-C', 'victory', 'rev-parse', ref], text=True).strip()
              if actual != head:
                  raise SystemExit('bundle does not match the candidate report')
          PY
      - name: Publish forge/main
        working-directory: victory
        run: git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" refs/heads/forge/main:refs/heads/forge/main
      - name: Publish forge/tested when regression checks pass
        if: needs.forge.outputs.promoted == 'true'
        working-directory: victory
        run: >
          git push "--force-with-lease=refs/heads/forge/tested:${PREVIOUS_TESTED}"
          "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          refs/heads/forge/tested:refs/heads/forge/tested
      - name: Publish STATUS.md
        working-directory: forge-status
        run: |
          git config user.name "VIctory Forge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../out/STATUS.md ../out/status.json .
          git add STATUS.md status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Forge status $(date -u +'%Y-%m-%d %H:%M UTC')"
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git pull -q --rebase "$url" forge-status
          git push "$url" HEAD:forge-status
